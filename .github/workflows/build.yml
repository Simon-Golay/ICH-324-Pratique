name: Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Installation des dependances
        run: npm ci
      - name: Tests
        run: npm run test:coverage
      - name: Publication de l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: |
            index.js
            package.json
            junit.xml
      - name: Partage du rapport de couverture
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage/lcov.info
  sonarcloud:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source (historique complet)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0     

      - name: Récupération du rapport de couverture
        uses: actions/download-artifact@v5
        with:
          name: coverage-report
          path: coverage/

 
      - name: Analyse SonarCloud et Quality Gate
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}